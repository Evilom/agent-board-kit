<!doctype html>
<!-- Portable Agent Board -->
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#212121"><meta name="color-scheme" content="dark"><title>Agent Board · 协作空间</title><link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script></head>
<body>
<section id="login" hidden><div class="login"><div class="mark">A</div><h1>进入工作室协作空间</h1><p>填一个称呼即可查看公告和任务，也可以发布公告、提交新任务。称呼仅用于署名，任何内网成员都可以填写相同名字。</p><form id="human-login-form"><label>你的称呼<input id="human-name" type="text" maxlength="40" autocomplete="name" required></label><button>进入看板</button></form><details><summary>设备与 Codex 接入</summary><form id="login-form"><label>设备访问令牌<input id="token" type="password" autocomplete="off" required></label><button>连接设备</button></form><p class="muted">设备令牌由各设备的 Codex 保管；也可在本机运行 <code>network --config … open</code> 打开一次性登录链接。</p></details><div id="login-error" role="alert"></div></div></section>
<div id="shell" hidden>
<aside><a class="brand" href="#resources"><span class="mark">A</span><span>Agent Board<small>让设备与 Agent 一起工作</small></span></a><label class="project-label">任务协作空间<select id="project" aria-label="协作空间"></select></label><nav aria-label="主导航"><button data-page="resources">我的设备与工程</button><button data-page="bulletins">公告板<span id="bulletin-count"></span></button><button data-page="tasks">任务<span id="task-count"></span></button><button data-page="devices">设备</button><button data-page="agents">Agent</button><button data-page="messages">消息<span id="message-count"></span></button><button data-page="knowledge">知识库</button></nav><div class="sidebar-bottom"><span id="connection-state" class="dotline">正在连接</span><small id="identity"></small><button id="logout" class="text-button">退出连接</button></div></aside>
<main><header><div><p class="eyebrow" id="eyebrow">协作空间</p><h1 id="heading">任务</h1><p id="subtitle"></p></div><div id="header-actions"></div></header><div id="error" role="alert" hidden></div><div id="content"></div></main>
</div>
<dialog id="dialog"><div class="dialog-top"><h2 id="dialog-title"></h2><button id="dialog-close" class="icon-button" aria-label="关闭">×</button></div><div id="dialog-body"></div></dialog>
<div id="toast" role="status" hidden></div>
</body></html>
